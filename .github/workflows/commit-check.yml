name: Commit Msg Check Action
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  preflight:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
  
        - name: Compute base/head
          id: diff
          shell: bash
          run: |
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD" >> "$GITHUB_OUTPUT"
  
        - name: Validate commit messages locally (no API)
          run: |
            BASE="${{ steps.diff.outputs.base }}"
            HEAD="${{ steps.diff.outputs.head }}"
            git rev-list --no-merges "$BASE..$HEAD" > commits.txt || true
            python3 .github/scripts/check_commits_local.py \
              --base "$BASE" --head "$HEAD" \
              --body-limit 72 --sub-limit 50 --check-blank-line true

  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Run custom commit check
        uses: ynancher/commit-msg-check-action@ynancher-test
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body-char-limit: 72
          sub-char-limit: 50
          check-blank-line: true
