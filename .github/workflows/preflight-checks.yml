name: QC Preflight Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preflight:
    name: Run QC Preflight Checks
    uses: njjetha/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@commit-msg-check
    with:
      enable-semgrep-scan: true
      enable-dependency-review: true
      enable-repolinter-check: true
      enable-copyright-license-check: true
      enable-commit-email-check: true
      enable-commit-msg-check: true
      commit-msg-check-extra-options: '{"check-blank-line": true, "body-char-limit": 70, "sub-char-limit": 70}'
      enable-armor-checkers: false
    permissions:
      contents: read
      security-events: write
